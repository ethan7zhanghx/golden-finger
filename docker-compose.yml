version: "3.9"

services:
  api:
    image: python:3.12-slim
    working_dir: /app
    command: bash -lc "pip install -r backend/requirements.txt && uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./:/app
    env_file:
      - .env.example
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  worker:
    image: python:3.12-slim
    working_dir: /app
    command: bash -lc "pip install -r backend/requirements.txt && celery -A backend.app.tasks.celery_app.celery_app worker --loglevel=info"
    volumes:
      - ./:/app
    env_file:
      - .env.example
    depends_on:
      - postgres
      - redis

  beat:
    image: python:3.12-slim
    working_dir: /app
    command: bash -lc "pip install -r backend/requirements.txt && celery -A backend.app.tasks.celery_app.celery_app beat --loglevel=info"
    volumes:
      - ./:/app
    env_file:
      - .env.example
    depends_on:
      - redis

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: jinshouzhi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
